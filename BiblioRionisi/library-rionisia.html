<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Библиотека Рионисии Луфар</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  :root {
    /* ── палитра фон ── */
    --bg: #0e1117;
    --panel: #161b26;
    --panel-2: #1d2433;
    --line: #2a3346;

    /* ── Полки: тёмные панели ── */
    --wood-1: #2a3446;
    --wood-2: #1d2433;
    --wood-3: #161b26;
    --wood-4: #0a0e14;

    /* ── Металл креплений ── */
    --iron-1: #4a5566;
    --iron-2: #2a3346;
    --iron-3: #12182a;

    /* ── Текст ── */
    --ink: #d4cec1;
    --muted: #9aa3b2;

    /* ── Золото ── */
    --gold: #d4a857;
    --gold-bright: #e8c878;
    --gold-deep: #8a6d34;
  }

  /* ═══════════ ФОН ═══════════ */
  body {
    margin: 0;
    padding: 50px 20px 80px;
    min-height: 100vh;
    font-family: 'PT Serif', Georgia, serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 0%, #1b2233 0%, transparent 55%),
      radial-gradient(circle at 85% 100%, #221c14 0%, transparent 50%),
      var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* ═══════════ КНОПКА ВОЗВРАТА ═══════════ */
  .back-link {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 50;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px 9px 14px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 0.86em;
    letter-spacing: 0.08em;
    color: var(--gold);
    text-decoration: none;
    background: linear-gradient(180deg, rgba(29, 36, 51, 0.92), rgba(14, 17, 23, 0.92));
    border: 1px solid rgba(212, 168, 87, 0.35);
    border-radius: 4px;
    box-shadow:
      0 6px 18px rgba(0, 0, 0, 0.6),
      inset 0 1px 1px rgba(200, 220, 255, 0.06),
      inset 0 -2px 6px rgba(0, 0, 0, 0.5);
    transition:
      color 0.3s ease,
      border-color 0.3s ease,
      box-shadow 0.3s ease,
      transform 0.3s ease,
      background 0.3s ease;
  }

  .back-link__arrow {
    font-size: 1.1em;
    line-height: 1;
    transition: transform 0.3s ease;
  }

  .back-link:hover,
  .back-link:focus-visible {
    color: var(--gold-bright);
    border-color: rgba(212, 168, 87, 0.85);
    background: linear-gradient(180deg, rgba(38, 47, 66, 0.95), rgba(18, 22, 30, 0.95));
    box-shadow:
      0 0 22px rgba(212, 168, 87, 0.32),
      0 6px 18px rgba(0, 0, 0, 0.65),
      inset 0 1px 1px rgba(200, 220, 255, 0.10),
      inset 0 -2px 6px rgba(0, 0, 0, 0.5);
    transform: translateX(-3px);
    outline: none;
  }

  .back-link:hover .back-link__arrow,
  .back-link:focus-visible .back-link__arrow {
    transform: translateX(-3px);
  }

  .back-link:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  /* ═══════════ ЗАГОЛОВОК ═══════════ */
  .library-header {
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    z-index: 2;
    max-width: 720px;
  }

  .library-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.8em;
    font-weight: 900;
    font-style: italic;
    color: var(--gold-bright);
    margin: 0;
    line-height: 1.1;
    letter-spacing: 0.02em;
    text-shadow:
      0 0 24px rgba(212, 168, 87, 0.28),
      0 2px 4px rgba(0, 0, 0, 0.95);
  }

  .library-tagline {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 0.9em;
    color: var(--muted);
    margin: 12px 0 0;
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }

  .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 18px auto;
    max-width: 320px;
  }
  .ornament::before,
  .ornament::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line), transparent);
  }
  .ornament .diamond {
    width: 7px;
    height: 7px;
    background: var(--gold);
    transform: rotate(45deg);
    box-shadow: 0 0 10px rgba(212, 168, 87, 0.6);
  }

  /* ═══════════ МАГИЧЕСКИЙ КАРТОТЕЧНЫЙ ШАР ═══════════ */
  .catalog-orb {
    position: relative;
    width: 270px;
    height: 270px;
    margin: 26px auto 6px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 32% 28%, rgba(232, 200, 120, 0.18), transparent 42%),
      radial-gradient(circle at 70% 76%, rgba(120, 150, 200, 0.10), transparent 52%),
      radial-gradient(circle at 50% 50%, #14181f 0%, #0a0e14 60%, #040507 100%);
    border: 2px solid var(--gold);
    box-shadow:
      0 0 0 6px rgba(212, 168, 87, 0.08),
      0 0 0 12px rgba(212, 168, 87, 0.03),
      0 0 45px rgba(212, 168, 87, 0.22),
      0 18px 45px rgba(0, 0, 0, 0.85),
      inset 0 0 45px rgba(0, 0, 0, 0.75),
      inset 0 3px 12px rgba(232, 200, 120, 0.10);
    animation: orbPulse 5s ease-in-out infinite;
    z-index: 5;
  }

  @keyframes orbPulse {
    0%, 100% {
      box-shadow:
        0 0 0 6px rgba(212, 168, 87, 0.08),
        0 0 0 12px rgba(212, 168, 87, 0.03),
        0 0 45px rgba(212, 168, 87, 0.22),
        0 18px 45px rgba(0, 0, 0, 0.85),
        inset 0 0 45px rgba(0, 0, 0, 0.75),
        inset 0 3px 12px rgba(232, 200, 120, 0.10);
    }
    50% {
      box-shadow:
        0 0 0 6px rgba(212, 168, 87, 0.14),
        0 0 0 12px rgba(212, 168, 87, 0.05),
        0 0 60px rgba(212, 168, 87, 0.38),
        0 18px 45px rgba(0, 0, 0, 0.85),
        inset 0 0 45px rgba(0, 0, 0, 0.75),
        inset 0 3px 12px rgba(232, 200, 120, 0.12);
    }
  }

  .catalog-orb::before {
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 1px solid rgba(212, 168, 87, 0.42);
    pointer-events: none;
  }

  .catalog-orb::after {
    content: "";
    position: absolute;
    top: 28px;
    left: 52px;
    width: 58px;
    height: 34px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(232, 200, 120, 0.32), transparent 72%);
    transform: rotate(-28deg);
    filter: blur(1px);
    pointer-events: none;
  }

  .catalog-orb__content {
    position: relative;
    z-index: 2;
    width: 66%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
  }

  .catalog-orb__rune {
    color: var(--gold);
    font-size: 0.85em;
    opacity: 0.7;
    letter-spacing: 0.4em;
    text-shadow: 0 0 10px rgba(212, 168, 87, 0.55);
  }

  .catalog-orb__input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(212, 168, 87, 0.45);
    color: var(--gold-bright);
    font-family: 'PT Serif', serif;
    font-size: 0.92em;
    text-align: center;
    padding: 6px 2px;
    outline: none;
    letter-spacing: 0.04em;
    transition: border-color 0.3s ease, color 0.3s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  .catalog-orb__input::-webkit-search-cancel-button {
    -webkit-appearance: none;
    appearance: none;
    display: none;
  }
  .catalog-orb__input::placeholder {
    color: rgba(212, 168, 87, 0.5);
    font-style: italic;
  }
  .catalog-orb__input:focus {
    border-bottom-color: var(--gold-bright);
    color: #f0d890;
    text-shadow: 0 0 10px rgba(232, 200, 120, 0.35);
  }

  /* ═══════════ БИБЛИОТЕКА ═══════════ */
  .library {
    width: 100%;
    max-width: 780px;
    position: relative;
    z-index: 2;
  }

  .shelf {
    margin-bottom: 30px;
    position: relative;
  }

  .books-stage {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 55px;
    padding: 20px 50px 0;
    min-height: 500px;
    perspective: 1400px;
    perspective-origin: 50% 100%;
    position: relative;
  }

  .shelf--empty .books-stage { min-height: 130px; }
  .shelf--empty .plank { opacity: 0.55; }

  /* ═══════════ ПОЛКА ═══════════ */
  .plank {
    position: relative;
    width: 100%;
    height: 28px;
    background-image:
      repeating-linear-gradient(90deg,
        transparent 0, transparent 18px,
        rgba(0, 0, 0, 0.18) 18px, rgba(0, 0, 0, 0.18) 19px),
      repeating-linear-gradient(0deg,
        rgba(120, 150, 200, 0.06) 0, rgba(120, 150, 200, 0.06) 1px,
        transparent 1px, transparent 5px),
      linear-gradient(180deg,
        var(--wood-1) 0%,
        var(--wood-2) 18%,
        var(--wood-3) 55%,
        var(--wood-4) 100%);
    border-top: 1px solid rgba(212, 168, 87, 0.28);
    border-radius: 2px;
    box-shadow:
      0 12px 32px rgba(0, 0, 0, 0.95),
      0 24px 50px rgba(0, 0, 0, 0.75),
      inset 0 2px 3px rgba(120, 150, 200, 0.10),
      inset 0 -3px 6px rgba(0, 0, 0, 0.75);
  }

  .plank::before,
  .plank::after {
    content: "";
    position: absolute;
    top: -8px;
    width: 34px;
    height: 44px;
    background:
      linear-gradient(180deg,
        #6a7480 0%,
        var(--iron-1) 20%,
        var(--iron-2) 60%,
        var(--iron-3) 100%);
    border: 1px solid rgba(212, 168, 87, 0.22);
    border-radius: 2px;
    box-shadow:
      inset 0 1px 1px rgba(200, 220, 255, 0.14),
      inset 0 -2px 3px rgba(0, 0, 0, 0.6),
      0 3px 6px rgba(0, 0, 0, 0.7);
    z-index: 1;
  }
  .plank::before { left: 18px; }
  .plank::after  { right: 18px; }

  /* ═══════════ КНИГА ═══════════ */
  .book {
    /* Коричневая кожа — по умолчанию */
    --leather-1: #4a2e15;
    --leather-2: #1e0f05;
    --accent: #d4a857;
    --glow-color: rgba(212, 168, 87, 0.45);

    display: block;
    width: 145px;
    height: 470px;
    text-decoration: none;
    color: inherit;
    position: relative;
    transform-origin: bottom center;
    transform-style: preserve-3d;
    transition:
      transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
      opacity 0.4s ease,
      filter 0.4s ease;
    outline: none;
    will-change: transform;
  }

  /* мягкая тень под книгой */
  .book::after {
    content: "";
    position: absolute;
    bottom: -6px;
    left: 8%;
    width: 84%;
    height: 12px;
    background: radial-gradient(ellipse, rgba(0, 0, 0, 0.95), transparent 70%);
    z-index: -1;
    border-radius: 50%;
    filter: blur(2px);
  }

  .book:hover,
  .book:focus-visible {
    transform: translateY(-18px) rotate(-1.2deg);
    filter: drop-shadow(8px 22px 32px rgba(0, 0, 0, 0.95));
  }

  .book:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 6px;
    border-radius: 6px;
  }

  /* затемнение при поиске */
  .book.is-dimmed {
    opacity: 0.22;
    filter: grayscale(0.9) blur(0.6px);
    pointer-events: none;
  }

  /* ═══════════ КОРЕШОК / ОБЛОЖКА ═══════════ */
  .book-spine {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 3px 7px 7px 3px;
    overflow: hidden;
    transform-style: preserve-3d;

    background-color: var(--leather-1);
    background-image:
      /* зерно кожи */
      radial-gradient(ellipse 35% 18% at 25% 28%, rgba(0, 0, 0, 0.32), transparent 70%),
      radial-gradient(ellipse 28% 14% at 72% 65%, rgba(0, 0, 0, 0.26), transparent 70%),
      radial-gradient(ellipse 22% 12% at 45% 82%, rgba(255, 220, 180, 0.10), transparent 70%),
      radial-gradient(ellipse 30% 15% at 80% 20%, rgba(0, 0, 0, 0.24), transparent 70%),
      /* золотые декоративные полоски (шильдики) */
      linear-gradient(180deg,
        transparent 0%, transparent 9.5%,
        rgba(0, 0, 0, 0.65) 9.5%, rgba(255, 220, 180, 0.25) 10%, rgba(0, 0, 0, 0.75) 10.5%,
        transparent 10.5%, transparent 19.5%,
        rgba(0, 0, 0, 0.65) 19.5%, rgba(255, 220, 180, 0.25) 20%, rgba(0, 0, 0, 0.75) 20.5%,
        transparent 20.5%, transparent 79.5%,
        rgba(0, 0, 0, 0.65) 79.5%, rgba(255, 220, 180, 0.25) 80%, rgba(0, 0, 0, 0.75) 80.5%,
        transparent 80.5%, transparent 89.5%,
        rgba(0, 0, 0, 0.65) 89.5%, rgba(255, 220, 180, 0.25) 90%, rgba(0, 0, 0, 0.75) 90.5%,
        transparent 90.5%),
      linear-gradient(135deg, var(--leather-1) 0%, var(--leather-2) 100%);

    box-shadow:
      5px 12px 22px rgba(0, 0, 0, 0.9),
      /* золотая кайма по контуру обложки */
      inset 0 0 0 1px rgba(212, 168, 87, 0.55),
      inset 0 0 0 2px rgba(0, 0, 0, 0.55),
      /* объём кожи */
      inset 0 0 90px rgba(0, 0, 0, 0.45),
      inset 3px 0 6px rgba(0, 0, 0, 0.5),
      inset -4px 0 8px rgba(255, 220, 180, 0.08);
    transition: box-shadow 0.35s ease;
    z-index: 2;
  }

  .book:hover .book-spine,
  .book:focus-visible .book-spine {
    box-shadow:
      8px 22px 32px rgba(0, 0, 0, 0.95),
      0 0 38px var(--glow-color),
      inset 0 0 0 1px rgba(212, 168, 87, 0.85),
      inset 0 0 0 2px rgba(0, 0, 0, 0.55),
      inset 0 0 90px rgba(0, 0, 0, 0.45),
      inset 3px 0 6px rgba(0, 0, 0, 0.5),
      inset -4px 0 8px rgba(255, 220, 180, 0.12);
  }

  /* металлические наугольники сверху/снизу обложки */
  .book-spine::before,
  .book-spine::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 16px;
    background:
      linear-gradient(180deg,
        #7a8492 0%,
        var(--iron-1) 22%,
        var(--iron-2) 62%,
        var(--iron-3) 100%);
    border-top: 1px solid #9aa4b0;
    border-bottom: 1px solid #0a0503;
    box-shadow:
      inset 0 1px 1px rgba(255, 230, 180, 0.32),
      inset 0 -2px 2px rgba(0, 0, 0, 0.6),
      0 2px 3px rgba(0, 0, 0, 0.7);
    z-index: 5;
  }
  .book-spine::before { top: 0; border-radius: 3px 7px 0 0; }
  .book-spine::after  { bottom: 0; border-radius: 0 0 7px 3px; }

  /* ═══════════ ЗОЛОТАЯ КАЙМА (внутренняя рамка) ═══════════ */
  .book-frame {
    position: absolute;
    inset: 22px 9px;
    border: 1px solid rgba(212, 168, 87, 0.65);
    border-radius: 2px;
    pointer-events: none;
    z-index: 4;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.55),
      inset 0 0 0 1px rgba(0, 0, 0, 0.35),
      0 0 8px rgba(212, 168, 87, 0.22);
  }

  /* ═══════════ НАДПИСИ НА ОБЛОЖКЕ ═══════════ */
  .book-spine > span {
    position: absolute;
    pointer-events: none;
    z-index: 6;
  }

  /* ★ Единый стиль значков: принудительно текстовое представление ★ */
  .book-symbol {
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.05em;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 10px var(--glow-color), 0 1px 2px rgba(0,0,0,0.95);
    /* подстраховка от цветных эмодзи */
    font-variant-emoji: text;
    -webkit-font-feature-settings: "liga" 1;
            font-feature-settings: "liga" 1;
  }

  .book-title {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    transform-origin: center center;
    white-space: nowrap;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 1.15em;
    letter-spacing: 0.06em;
    color: var(--accent);
    text-shadow:
      0 0 12px var(--glow-color),
      0 1px 2px rgba(0,0,0,0.95),
      0 0 1px var(--accent);
  }

  .book-flourish {
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.95em;
    color: var(--accent);
    opacity: 0.75;
    text-shadow: 0 0 8px var(--glow-color);
  }

  /* ═══════════ ЦВЕТА КНИГ ═══════════ */
  .book--amplification {
    --leather-1: #4a2e15;    /* тёплый каштановый */
    --leather-2: #1e0f05;
    --accent: #d4a857;
    --glow-color: rgba(212, 168, 87, 0.55);
  }

  .book--poisons {
    --leather-1: #3a2210;    /* тёмный шоколад */
    --leather-2: #150a04;
    --accent: #c9a961;
    --glow-color: rgba(201, 169, 97, 0.5);
  }

  /* ═══════════════════════════════════════════════════════════
     АНИМАЦИЯ: КНИГА ВЫНИМАЕТСЯ С ПОЛКИ
     Фазы:
       0–20%  лёгкий подъём и наклон — книга «отрывается» от полки
       20–70% плавное извлечение вверх-вбок, тень уходит
       70–100% книга уносится прочь, растворяясь
     ═══════════════════════════════════════════════════════════ */
  .book.opening {
    animation: bookPull 1.4s cubic-bezier(0.4, 0, 0.28, 1) forwards;
    pointer-events: none;
    z-index: 100;
    filter: none !important;
  }

  @keyframes bookPull {
    0% {
      transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      opacity: 1;
    }
    18% {
      transform: translate3d(0, -26px, 0) rotate(-1.6deg) scale(1.02);
      opacity: 1;
    }
    100% {
      transform: translate3d(18px, -68px, 0) rotate(-9deg) scale(1.15);
      opacity: 0;
    }
  }

  /* ═══════════ ТЁМНОЕ ЗАТЕМНЕНИЕ ПЕРЕД ПЕРЕХОДОМ ═══════════ */
  .page-flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(
      ellipse at center,
      transparent 0%,
      rgba(10, 8, 5, 0.55) 50%,
      rgba(3, 3, 4, 0.97) 100%
    );
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
    transition: opacity 0.4s ease-in;
  }
  .page-flash.active { opacity: 1; }

  /* ═══════════ ПОДСКАЗКА ═══════════ */
  .hint {
    margin-top: 40px;
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 0.9em;
    color: var(--gold-deep);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.7;
    animation: pulseHint 4s ease-in-out infinite;
    position: relative;
    z-index: 2;
  }

  @keyframes pulseHint {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 0.85; }
  }

  /* ═══════════ ФУТЕР ═══════════ */
  .footer {
    margin-top: 60px;
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: var(--muted);
    letter-spacing: 0.1em;
    font-size: 0.82em;
    opacity: 0.7;
    position: relative;
    z-index: 2;
  }
  .footer .divider { margin: 0 12px; color: var(--line); }

  /* ═══════════ АДАПТИВ ═══════════ */
  @media (max-width: 780px) {
    body { padding: 30px 12px 50px; }
    .library-header h1 { font-size: 2em; }
    .library-tagline { font-size: 0.75em; letter-spacing: 0.15em; }
    .catalog-orb { width: 230px; height: 230px; }
    .books-stage { gap: 30px; padding: 15px 25px 0; min-height: 400px; }
    .book { width: 115px; height: 380px; }
    .book-title { font-size: 0.95em; }
    .book-symbol { font-size: 0.9em; }
    .book-flourish { font-size: 0.8em; }
    .plank { height: 22px; }
    .plank::before, .plank::after { width: 26px; height: 32px; }
    .shelf--empty .books-stage { min-height: 100px; }

    .back-link {
      top: 14px;
      left: 14px;
      font-size: 0.78em;
      padding: 8px 14px 8px 11px;
      gap: 8px;
    }
  }

  @media (max-width: 460px) {
    .catalog-orb { width: 200px; height: 200px; margin-top: 18px; }
    .catalog-orb__input { font-size: 0.85em; }
    .books-stage { gap: 20px; padding: 10px 15px 0; min-height: 330px; }
    .book { width: 95px; height: 315px; }
    .book-title { font-size: 0.82em; letter-spacing: 0.03em; }
    .book-symbol { font-size: 0.8em; }
    .book-flourish { font-size: 0.7em; }
    .library-header h1 { font-size: 1.6em; }

    /* На узких экранах — только стрелка, чтобы не мешать заголовку */
    .back-link {
      top: 10px;
      left: 10px;
      padding: 8px 10px;
      font-size: 1em;
    }
    .back-link__text { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .book { transition: none; }
    .catalog-orb { animation: none; }
    .book.opening { animation-duration: 0.35s; }
    .page-flash { transition: opacity 0.15s ease-in; }
    .hint { animation: none; opacity: 0.7; }
    .back-link,
    .back-link__arrow { transition: none; }
  }
</style>
</head>
<body>

<!-- ══════════════ КНОПКА ВОЗВРАТА ══════════════ -->
<a href="../index.html"
   class="back-link"
   aria-label="Вернуться в раздел Хроники Эльхара"
   title="Вернуться в раздел «Хроники Эльхара»">
  <span class="back-link__arrow" aria-hidden="true">←</span>
  <span class="back-link__text">Хроники Эльхара</span>
</a>

<!-- ══════════════ ШАПКА ══════════════ -->
<header class="library-header">
  <h1>Библиотека<br>Рионисии Луфар</h1>
  <div class="ornament"><span class="diamond"></span></div>
  <p class="library-tagline">· трактаты из личного архива ·</p>
</header>

<!-- ══════════════ МАГИЧЕСКИЙ КАРТОТЕЧНЫЙ ШАР ══════════════ -->
<div class="catalog-orb" role="search">
  <div class="catalog-orb__content">
    <span class="catalog-orb__rune" aria-hidden="true">✦</span>
    <input
      type="search"
      class="catalog-orb__input"
      id="librarySearch"
      placeholder="Найти трактат…"
      aria-label="Поиск книг в библиотеке"
      autocomplete="off"
    >
    <span class="catalog-orb__rune" aria-hidden="true">✦</span>
  </div>
</div>

<!-- ══════════════ БИБЛИОТЕКА ══════════════ -->
<div class="library">

  <!-- ═══ ПОЛКА I · ТРАКТАТЫ ═══ -->
  <section class="shelf">
    <div class="books-stage">

      <a href="Pharmacy/tractat-pharmacy.html"
         class="book book--poisons"
         aria-label="Открыть: О Фармации"
         title="О Фармации · Рионисия Луфар">
        <div class="book-spine">
          <span class="book-frame" aria-hidden="true"></span>
          <!-- U+2697 U+FE0E — алхимический алембик в текстовом (монохромном) представлении -->
          <span class="book-symbol" aria-hidden="true">⚗︎</span>
          <span class="book-title">О Фармации</span>
          <span class="book-flourish">❧</span>
        </div>
      </a>

      <a href="Amplification/tractat-amplification.html"
         class="book book--amplification"
         aria-label="Открыть: Об Амплификации"
         title="Об Амплификации · Рионисия Луфар">
        <div class="book-spine">
          <span class="book-frame" aria-hidden="true"></span>
          <span class="book-symbol" aria-hidden="true">❦</span>
          <span class="book-title">Об Амплификации</span>
          <span class="book-flourish">❧</span>
        </div>
      </a>

      <a href="Poisons/tractat-poisons.html"
         class="book book--poisons"
         aria-label="Открыть: О Ядах"
         title="О Ядах · Рионисия Луфар">
        <div class="book-spine">
          <span class="book-frame" aria-hidden="true"></span>
          <span class="book-symbol" aria-hidden="true">☠</span>
          <span class="book-title">О Ядах</span>
          <span class="book-flourish">❧</span>
        </div>
      </a>

    </div>
    <div class="plank"></div>
  </section>

  <!-- ═══ ПОЛКА II · ПУСТАЯ ═══ -->
  <section class="shelf shelf--empty">
    <div class="books-stage"></div>
    <div class="plank"></div>
  </section>

  <!-- ═══ ПОЛКА III · ПУСТАЯ ═══ -->
  <section class="shelf shelf--empty">
    <div class="books-stage"></div>
    <div class="plank"></div>
  </section>

</div>

<!-- ══════════════ ПОДСКАЗКА ══════════════ -->
<p class="hint">— прикоснитесь к корешку —</p>

<!-- ══════════════ ФУТЕР ══════════════ -->
<footer class="footer">
  Из личного архива семьи Луфар
  <span class="divider">✦</span>
  Город Рассвета
</footer>

<!-- ══════════════ ПЕРГАМЕНТНЫЙ ПЕРЕХОД ══════════════ -->
<div id="pageFlash" class="page-flash"></div>

<!-- ══════════════ СКРИПТ ══════════════ -->
<script>
  (function () {
    'use strict';

    const flash      = document.getElementById('pageFlash');
    const books      = document.querySelectorAll('a.book');
    const searchInp  = document.getElementById('librarySearch');
    let navigating   = false;

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* Полный цикл анимации извлечения книги = 1400 мс */
    const openDuration = reduceMotion ? 350 : 1400;
    /* Затемнение стартует за ~550 мс до перехода */
    const flashDelay   = reduceMotion ? 120 : 850;

    /* ─── Сброс состояния (для возврата «назад» из bfcache) ─── */
    function resetLibraryState() {
      books.forEach(function (b) { b.classList.remove('opening'); });
      if (flash) flash.classList.remove('active');
      navigating = false;
    }

    window.addEventListener('pageshow', function (event) {
      if (event.persisted) resetLibraryState();
    });
    window.addEventListener('load', resetLibraryState);

    /* ─── Извлечение книги с полки ─── */
    books.forEach(function (book) {
      book.addEventListener('click', function (e) {
        if (navigating) { e.preventDefault(); return; }

        const href = book.getAttribute('href');
        if (!href) return;

        e.preventDefault();
        navigating = true;

        book.classList.add('opening');

        /* затемнение — синхронно с финалом анимации */
        setTimeout(function () {
          if (flash) flash.classList.add('active');
        }, flashDelay);

        /* переход после полной анимации */
        setTimeout(function () {
          window.location.href = href;
        }, openDuration);
      });
    });

    /* ─── Поиск по библиотеке ─── */
    if (searchInp) {
      searchInp.addEventListener('input', function () {
        const q = this.value.trim().toLowerCase();
        books.forEach(function (book) {
          const titleEl = book.querySelector('.book-title');
          const title   = titleEl ? titleEl.textContent.toLowerCase() : '';
          const match   = !q || title.indexOf(q) !== -1;
          book.classList.toggle('is-dimmed', !match);
        });
      });

      searchInp.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          this.value = '';
          this.dispatchEvent(new Event('input'));
          this.blur();
        }
      });
    }
  })();
</script>

</body>
</html>
